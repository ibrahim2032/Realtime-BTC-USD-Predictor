[tool.poetry]
name = "src"
version = "0.1.0"
description = ""
authors = ["Ibrahim Oshinubi <ibrahim.oshinubi@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
quixstreams = "3.9.0"
websocket-client = "^1.8.0"
loguru = "^0.7.3"
python-dotenv = "^1.0.1"
pydantic-settings = "2.6.0"
pydantic = "^2.10"
dotenv = "^0.9.9"
dotenv-cli = "^3.4.1"
pandas = "^2.2.3"
pyarrow = "^19.0.1"


[tool.poetry.group.dev.dependencies]
ruff = "^0.6.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]